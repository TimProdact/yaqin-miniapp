<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yaqin</title>
  <script>
    // Telegram WebView часто не следует 301 GitHub Pages без завершающего `/`,
    // из‑за чего ломаются относительные `./js/main.js` → пустой экран.
    (function () {
      var path = location.pathname;
      if (path.slice(-1) !== '/' && !/\.[a-z0-9]+$/i.test(path)) {
        location.replace(path + '/' + location.search + location.hash);
      }
    })();
    window.addEventListener('error', function (event) {
      if (document.getElementById('yaqin-boot-error')) return;
      var box = document.createElement('div');
      box.id = 'yaqin-boot-error';
      box.className = 'yaqin-boot-error';
      box.innerHTML = '<h1>Yaqin не загрузился</h1><pre></pre>';
      box.querySelector('pre').textContent = String(event.message || event.error || event);
      document.documentElement.appendChild(box);
    });
    window.addEventListener('unhandledrejection', function (event) {
      if (document.getElementById('yaqin-boot-error')) return;
      var box = document.createElement('div');
      box.id = 'yaqin-boot-error';
      box.className = 'yaqin-boot-error';
      box.innerHTML = '<h1>Yaqin не загрузился</h1><pre></pre>';
      box.querySelector('pre').textContent = String(event.reason || event);
      document.documentElement.appendChild(box);
    });
  </script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./profile.css">
  <link rel="stylesheet" href="./connection.css">
  <link rel="stylesheet" href="./profile-details.css">
  <link rel="stylesheet" href="./chats.css">
  <link rel="stylesheet" href="./groups.css">
  <link rel="stylesheet" href="./me.css">
  <link rel="stylesheet" href="./verify.css">
  <link rel="stylesheet" href="./discover.css">
  <link rel="stylesheet" href="./person.css">
  <link rel="stylesheet" href="./safety.css">
  <link rel="stylesheet" href="./layout.css">
  <link rel="stylesheet" href="./demo.css">
  <link rel="stylesheet" href="./nav.css">
  <link rel="stylesheet" href="./onboarding.css">
</head>
<body>
  <main class="app">
    <header id="header"></header>
    <section id="view" class="view"></section>
    <nav class="nav">
      <button data-tab="people" class="active"><i class="ti ti-compass-filled"></i><small>Люди</small></button>
      <button data-tab="groups"><i class="ti ti-users"></i><small>Группы</small></button>
      <button data-tab="chats"><i class="ti ti-message-circle"></i><small>Чаты</small><b class="badge">2</b></button>
      <button data-tab="activity"><i class="ti ti-bell"></i><small>Лента</small></button>
      <button data-tab="me"><i class="ti ti-circle"></i><small>Профиль</small></button>
    </nav>
  </main>
  <script src="./config.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
