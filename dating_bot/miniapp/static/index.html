<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yaqin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./profile.css">
  <link rel="stylesheet" href="./connection.css">
</head>
<body>
  <main class="app">
    <div class="statusbar"><span>9:41</span><span><i class="ti ti-antenna-bars-5"></i><i class="ti ti-wifi"></i><i class="ti ti-battery-3"></i></span></div>
    <header id="header"></header>
    <section id="view"></section>
    <nav class="nav">
      <button data-tab="discover" class="active"><i class="ti ti-compass-filled"></i><small>People</small></button>
      <button data-tab="matches"><i class="ti ti-users"></i><small>Groups</small></button>
      <button data-tab="matches"><i class="ti ti-message-circle"></i><small>Chats</small><b class="badge">2</b></button>
      <button data-tab="profile"><i class="ti ti-bell"></i><small>Activity</small></button>
      <button data-tab="profile"><i class="ti ti-circle"></i><small>Me</small></button>
    </nav>
    <footer class="brand-footer"><span>✿</span><b>BFF</b><small>curated by</small><strong>〽 Mobbin</strong></footer>
  </main>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
